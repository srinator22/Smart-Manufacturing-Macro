# CI for this repository - runs the same gauntlet as local (scripts/check.sh).
#
# The start procedure (docs/procedures/start.md) must:
#   - fill the {{SETUP_STEPS_FILLED_BY_START}} block below: pin the runtime
#     version and install dependencies with a frozen lockfile
#   - when the recorded git workflow uses gated merges, enable branch
#     protection requiring the "check" job (via gh api if available,
#     otherwise record it as a manual step in START_REPORT.md)
#   - set the repository description and topics
#   - delete the deploy job if the project has no deploy target
name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the changelog freshness step regenerates
          # CHANGELOG.md from the whole git log once start wires it.
          fetch-depth: 0
      # {{SETUP_STEPS_FILLED_BY_START}}: pin the runtime version, install
      # dependencies with a frozen lockfile (fail on lockfile disagreement).
      - name: Run the gauntlet
        run: ./scripts/check.sh

  # {{delete if no deploy target}}
  # Deployment depends on validation of the exact same SHA
  # (docs/rules/ci-baseline.md): deploy needs check, runs only on version
  # tags, and racing deploys are serialized by the concurrency group.
  deploy:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      # {{DEPLOY_STEPS_FILLED_BY_START}}
      - name: Record deployment in the run summary
        if: always()
        run: |
          {
            echo "## Deploy"
            echo "- sha: ${GITHUB_SHA}"
            echo "- ref: ${GITHUB_REF_NAME}"
            echo "- result: ${{ job.status }}"
            echo "- time: $(date -u +%FT%TZ)"
          } >> "$GITHUB_STEP_SUMMARY"
