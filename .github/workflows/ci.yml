name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.401

      - name: Install pinned verification tools
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP "inventor-scripts-tools"
          New-Item -ItemType Directory -Path $toolRoot -Force | Out-Null

          $downloads = @(
            @{
              Name = "gitleaks"
              Uri = "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip"
              Sha256 = "d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e"
            },
            @{
              Name = "git-cliff"
              Uri = "https://github.com/orhun/git-cliff/releases/download/v2.14.1/git-cliff-2.14.1-x86_64-pc-windows-gnu.zip"
              Sha256 = "0b9ef3167f25c2357310c71061991f1a8b325ed10ebda59e4233d8601d61f7ef"
            }
          )

          foreach ($download in $downloads) {
            $archive = Join-Path $toolRoot "$($download.Name).zip"
            $destination = Join-Path $toolRoot $download.Name
            Invoke-WebRequest -Uri $download.Uri -OutFile $archive
            $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $download.Sha256) {
              throw "$($download.Name) SHA-256 mismatch: $actual"
            }
            Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
            $executable = Get-ChildItem -LiteralPath $destination -Recurse -Filter "$($download.Name).exe" |
              Select-Object -First 1
            if ($null -eq $executable) {
              throw "$($download.Name).exe was not present in the verified archive"
            }
            $executable.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Run the canonical gauntlet
        shell: bash
        run: ./scripts/check.sh
